# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main and once a day at 05:45 IST so "today" pages and countdowns stay fresh.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 0 * * *'   # 00:15 UTC = 05:45 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build site
        run: node build.js
        env:
          # Set these under Settings → Secrets and variables → Actions → Variables. All are optional.
          SITE_URL: ${{ vars.SITE_URL || 'https://fullmoonfinder.com' }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
          GA_ID: ${{ vars.GA_ID }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
          GSC_VERIFY: ${{ vars.GSC_VERIFY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000   # 30 min; ~27k pages can take longer than the default 10
